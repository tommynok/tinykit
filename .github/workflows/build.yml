name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TinyKit.apk
          size=$(stat -c %s dist/TinyKit.apk)
          echo "APK size: $size bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TinyKit-apk
          path: dist/TinyKit.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TinyKit.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
